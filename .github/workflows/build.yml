name: Build ZMK firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: hw75_keyboard@1.2
            keymap: hw75_keyboard.keymap
          - board: hw75_dynamic@A
            keymap: hw75_dynamic.keymap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 pyftsubset (fonttools)、墨水屏字体转换器和 protobuf 编译器
      - name: Set up build tools
        run: |
          apt-get update
          apt-get install -y python3-pip python3-fonttools protobuf-compiler curl nodejs npm
          npm install -g lv_font_conv
          pip install --break-system-packages fonttools || pip install fonttools

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Initialize workspace (west init)
        run: west init -l config

      - name: Update modules (west update)
        run: west update

      # 安装 Zephyr Python 依赖
      - name: Install Zephyr Python requirements
        run: |
          pip install --break-system-packages -r zephyr/scripts/requirements.txt || pip install -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        run: west zephyr-export

      # 解决 @A / @1.2 版本后缀匹配问题
      - name: Prepare keymap fallback
        run: |
          if [ -f "config/${{ matrix.keymap }}" ]; then
            cp "config/${{ matrix.keymap }}" "config/${{ matrix.board }}.keymap" || true
            cp "config/${{ matrix.keymap }}" "config/default.keymap" || true
          fi

      # 编译固件（显式传入 keymap 路径）
      - name: Build (${{ matrix.board }})
        run: |
          west build -s zmk/app -b ${{ matrix.board }} -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DZMK_KEYMAP="${GITHUB_WORKSPACE}/config/${{ matrix.keymap }}"

      # 整理生成产物
      - name: Rename artifacts
        run: |
          mkdir -p output
          if [ -f "build/zephyr/zmk.bin" ]; then cp build/zephyr/zmk.bin "output/${{ matrix.board }}-zmk.bin"; fi
          if [ -f "build/zephyr/zmk.hex" ]; then cp build/zephyr/zmk.hex "output/${{ matrix.board }}-zmk.hex"; fi
          if [ -f "build/zephyr/zmk.uf2" ]; then cp build/zephyr/zmk.uf2 "output/${{ matrix.board }}-zmk.uf2"; fi

      # 上传固件至 Actions 页面供下载
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-firmware
          path: output/*
