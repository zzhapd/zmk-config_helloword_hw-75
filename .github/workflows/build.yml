name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: hw75_dynamic@A
            keymap: hw75_dynamic.keymap
    steps:
      - name: Prepare variables
        run: echo "zephyr_version=${ZEPHYR_VERSION}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build tools
        run: |
          apt-get update
          apt-get install -y python3-pip protobuf-compiler curl
          curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
          apt-get install -y nodejs
          pip install -U fonttools
          npm install -g lv_font_conv

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Initialize workspace (west init)
        run: west init -l config

      - name: Update modules (west update)
        run: west update

      - name: Export Zephyr CMake package (west zephyr-export)
        run: west zephyr-export

      - name: Install Zephyr Python requirements
        run: pip install -r zephyr/scripts/requirements.txt

      - name: Prepare git
        run: git config --global --add safe.directory "*"

      - name: Build (${{ matrix.board }})
        run: west build -s zmk/app -b ${{ matrix.board }} -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename artifacts
        run: |
          mkdir -p build/artifacts
          [ -f build/zephyr/zmk.uf2 ] && cp build/zephyr/zmk.uf2 build/artifacts/${{ matrix.board }}-zmk.uf2
          [ -f build/zephyr/zmk.hex ] && cp build/zephyr/zmk.hex build/artifacts/${{ matrix.board }}-zmk.hex
          [ -f build/zephyr/zmk.bin ] && cp build/zephyr/zmk.bin build/artifacts/${{ matrix.board }}-zmk.bin

      - name: Archive (${{ matrix.board }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/artifacts
